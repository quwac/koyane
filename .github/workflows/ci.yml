name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release-version:
        description: Version used for publication and consumer verification
        type: string
        default: '0.0.1-SNAPSHOT'

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: '2026.8.11'
          sha256: 3d825b8341925abb398fba6fd8dcd7d6e92ade6820d892da62992e0765638e66
          install_args: >-
            --locked java bun node hk pkl lychee gh rumdl zizmor betterleaks
            github:github/gh-actions-lock github:jdx/jactionlint
          cache: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: mise run deps
      - run: mise run test:release
      - run: hk check --all --profile ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

  kotlin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORG_GRADLE_PROJECT_kagiroiSourceDir: ${{ github.workspace }}/build/ci-dependencies/kagiroi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Kagiroi common driver APIs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quwac/kagiroi
          ref: 9afee37b997c6c42f882f6a52799371a78f1212d
          path: build/ci-dependencies/kagiroi
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: '2026.8.11'
          sha256: 3d825b8341925abb398fba6fd8dcd7d6e92ade6820d892da62992e0765638e66
          install_args: --locked java bun
          cache: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: mise run test:kotlin
      - run: mise run test:bom
        env:
          ORG_GRADLE_PROJECT_version: ${{ inputs.release-version || '0.0.1-SNAPSHOT' }}

  compile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: '2026.8.11'
          sha256: 3d825b8341925abb398fba6fd8dcd7d6e92ade6820d892da62992e0765638e66
          install_args: --locked java bun
          cache: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - run: mise run test:compile
        env:
          COMPILE_TEST_SHARD_COUNT: 4
          COMPILE_TEST_SHARD_INDEX: ${{ matrix.shard }}

  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORG_GRADLE_PROJECT_kagiroiSourceDir: ${{ github.workspace }}/build/ci-dependencies/kagiroi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Kagiroi common driver APIs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quwac/kagiroi
          ref: 9afee37b997c6c42f882f6a52799371a78f1212d
          path: build/ci-dependencies/kagiroi
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: '2026.8.11'
          sha256: 3d825b8341925abb398fba6fd8dcd7d6e92ade6820d892da62992e0765638e66
          install_args: --locked java bun node
          cache: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: mise run test:workers:wasm
      - run: mise run test:workers:js
      - run: mise run test:workers:request
      - run: mise run test:node
      - run: mise run test:functions:node
      - run: mise run test:functions:edge
      - run: mise run deploy:dry-run:wasm
      - run: mise run deploy:dry-run:js

  test:
    if: ${{ always() }}
    needs: [quality, kotlin-tests, compile-tests, workers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful verification jobs
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.kotlin-tests.result }}" = success
          test "${{ needs.compile-tests.result }}" = success
          test "${{ needs.workers.result }}" = success
